name: Pozivnik – istraživanje izvora
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pratilac
  cancel-in-progress: false
jobs:
  istrazi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python istrazi.py
      - name: Sačuvaj rezultat
        run: |
          git config user.name "pozivnik-bot"
          git config user.email "bot@users.noreply.github.com"
          git add izlaz/istrazivanje.json izlaz/istrazivanje.csv
          git commit -m "Istraživanje izvora $(date +%F)" || { echo "Nema promjena"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
