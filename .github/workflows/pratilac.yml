name: Pozivnik – dnevno praćenje
on:
  schedule:
    - cron: "17 5 * * *"   # svaki dan u 06:17 po BiH vremenu (zimi)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  prati:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Pokreni pratilac
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ ! -f stanje.sqlite ]; then python pratilac.py --baseline; else python pratilac.py; fi
      # Supabase svaki dan sam preuzme izlaz/novi_pozivi_DATUM.json odavde (pg_cron + pg_net)
      - name: Sačuvaj stanje i izvještaje
        run: |
          git config user.name "pozivnik-bot"
          git config user.email "bot@users.noreply.github.com"
          git add stanje.sqlite
          git add izlaz/ 2>/dev/null || true
          git commit -m "Dnevno praćenje $(date +%F)" || echo "Nema promjena"
          git push
