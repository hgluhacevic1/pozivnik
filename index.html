<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pozivnik – javni pozivi u BiH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFCFA; --surface:#F1F4F0; --surface2:#E8EDE7; --line:#DFE5DD; --ink:#0F1A14; --ink2:#34433A; --muted:#5B685F;
  --accent:#0E7C5A; --accent-2:#0A6248; --accent-ink:#FFFFFF; --mint:#DDF2E8; --mint-ink:#0A4F3A;
  --forest:#073D2D; --forest-2:#0B5640; --forest-ink:#FFFFFF; --forest-muted:#A9CFC0;
  --feature:#073D2D; --feature-ink:#FFFFFF; --feature-muted:#A9CFC0; --feature-num:#7EE2B8;
  --amber:#F59E0B; --warm:#FFF0D2; --warm-ink:#874A00; --red:#C2331F; --red-bg:#FDE6E1;
  --sky:#E2ECF7; --sky-ink:#264E7A; --grey:#E8EDE7; --grey-ink:#34433A; --danger:#B42318;
  --focus:#0E7C5A; --shadow:0 1px 2px rgba(15,26,20,.06),0 8px 24px -12px rgba(15,26,20,.18);
  --shadow-hi:0 2px 4px rgba(15,26,20,.06),0 22px 44px -18px rgba(7,61,45,.35);
  --ease:cubic-bezier(.2,.7,.2,1); color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1310; --surface:#151D19; --surface2:#1C2621; --line:#26322C; --ink:#EEF3EF; --ink2:#C9D4CD; --muted:#98A69D;
    --accent:#3CC08F; --accent-2:#5BD3A5; --accent-ink:#04140D; --mint:#14382A; --mint-ink:#9BE7C6;
    --forest:#0B2E23; --forest-2:#114535; --forest-ink:#FFFFFF; --forest-muted:#A9CFC0;
    --feature:#0F3E2F; --feature-ink:#FFFFFF; --feature-muted:#B9D5C9; --feature-num:#8EF0C6;
    --warm:#3A2A10; --warm-ink:#F7C98A; --red:#FF7A63; --red-bg:#3A1914; --sky:#16273A; --sky-ink:#A8C7EA;
    --grey:#26322C; --grey-ink:#C9D4CD; --danger:#F97066; --focus:#3CC08F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); --shadow-hi:0 2px 4px rgba(0,0,0,.4),0 22px 44px -18px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1310; --surface:#151D19; --surface2:#1C2621; --line:#26322C; --ink:#EEF3EF; --ink2:#C9D4CD; --muted:#98A69D;
  --accent:#3CC08F; --accent-2:#5BD3A5; --accent-ink:#04140D; --mint:#14382A; --mint-ink:#9BE7C6;
  --forest:#0B2E23; --forest-2:#114535; --forest-ink:#FFFFFF; --forest-muted:#A9CFC0;
  --feature:#0F3E2F; --feature-ink:#FFFFFF; --feature-muted:#B9D5C9; --feature-num:#8EF0C6;
  --warm:#3A2A10; --warm-ink:#F7C98A; --red:#FF7A63; --red-bg:#3A1914; --sky:#16273A; --sky-ink:#A8C7EA;
  --grey:#26322C; --grey-ink:#C9D4CD; --danger:#F97066; --focus:#3CC08F;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); --shadow-hi:0 2px 4px rgba(0,0,0,.4),0 22px 44px -18px rgba(0,0,0,.7);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex:0 0 auto;display:inline-block;vertical-align:middle}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .25s,box-shadow .25s}
header.top.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 24px -20px rgba(15,26,20,.5)}
.top-in{max-width:1220px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:inline-flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif;font-weight:800;font-size:23px;letter-spacing:-.04em;color:var(--ink);text-decoration:none;margin-right:auto}
.logo .word span{color:var(--accent)}
.logo .mark{transition:transform .5s var(--ease)}
.logo:hover .mark{transform:rotate(-8deg) scale(1.06)}
nav.tabs{position:relative;display:flex;gap:2px;overflow-x:auto;max-width:100%;scrollbar-width:none;padding:4px;border-radius:999px;background:var(--surface)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{position:relative;z-index:1;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;color:var(--ink2);text-decoration:none;font-size:14.5px;font-weight:600;transition:color .2s}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--bg)}
nav.tabs .thumb{position:absolute;z-index:0;top:4px;left:0;height:40px;border-radius:999px;background:var(--ink);transition:transform .42s var(--ease),width .42s var(--ease);pointer-events:none}
nav.tabs a.cta{background:var(--accent);color:var(--accent-ink);margin-left:4px}
nav.tabs a.cta[aria-current="page"]{background:transparent}
.badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;align-items:center;justify-content:center;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:800}
nav.tabs a[aria-current="page"] .badge{background:var(--bg);color:var(--ink)}

main{max-width:1220px;margin:0 auto;padding:40px 20px 80px}
h1,h2,h3,.display{font-family:"Bricolage Grotesque","Plus Jakarta Sans",sans-serif}
h1{font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:-.045em;font-weight:800;margin:0}
h2{font-size:clamp(22px,2.4vw,28px);letter-spacing:-.03em;font-weight:700;margin:0;line-height:1.15}
.lead{font-size:18px;color:var(--muted);margin:12px 0 0;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{justify-content:space-between}
.section{margin-top:40px}
.count{font-variant-numeric:tabular-nums}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .18s var(--ease),background-color .2s,border-color .2s,box-shadow .25s,color .2s;-webkit-tap-highlight-color:transparent}
.btn:hover{border-color:var(--ink2)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -14px var(--accent)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2);box-shadow:0 14px 28px -14px var(--accent)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none}
.btn .ic{transition:transform .25s var(--ease)}
.btn:hover .ic.go{transform:translateX(3px)}
.btn.loading{color:transparent!important}
.btn.loading::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-color:var(--accent-ink) var(--accent-ink) transparent transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* status dot */
.st{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.st i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.st-otvoren i{background:#16A34A}
.st-otvoren i::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:#16A34A;opacity:.35;animation:ping 1.8s var(--ease) infinite}
.st-stalni i{background:#3B82C4}
.st-ocekuje i,.st-provjeriti i{background:var(--amber)}
.st-zatvoren{color:var(--muted)}
.st-zatvoren i{background:var(--line);box-shadow:inset 0 0 0 1.5px var(--muted)}
@keyframes ping{0%{transform:scale(.6);opacity:.5}80%,100%{transform:scale(1.9);opacity:0}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:var(--surface);color:var(--ink2)}
.pill.st-otvoren{background:var(--mint);color:var(--mint-ink)}
.pill.st-ocekuje,.pill.st-provjeriti{background:var(--warm);color:var(--warm-ink)}
.pill.st-stalni{background:var(--sky);color:var(--sky-ink)}

/* filter bar */
.fbar{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.fbar-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.seg{position:relative;display:inline-flex;padding:4px;border-radius:999px;background:var(--surface);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{position:relative;z-index:1;flex:0 0 auto;min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--ink2);font-weight:700;font-size:14px;cursor:pointer;transition:color .25s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button .n{margin-left:6px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.seg .thumb{position:absolute;z-index:0;top:4px;left:0;height:40px;border-radius:999px;background:var(--bg);box-shadow:var(--shadow);transition:transform .42s var(--ease),width .42s var(--ease)}
.cats{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:thin;scroll-snap-type:x proximity}
.cat{flex:0 0 auto;scroll-snap-align:start;display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 16px 6px 6px;border-radius:18px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-weight:700;font-size:14px;cursor:pointer;transition:transform .2s var(--ease),border-color .2s,background-color .2s,color .2s}
.cat:hover{transform:translateY(-2px);border-color:var(--ink2)}
.cat .ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);color:var(--ink2);transition:background-color .2s,color .2s}
.cat .n{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.cat[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.cat[aria-pressed="true"] .ico{background:var(--accent);color:var(--accent-ink)}
.cat[aria-pressed="true"] .n{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.search{position:relative;display:flex;align-items:center;flex:0 1 440px;min-width:240px}
.search .ic{position:absolute;left:16px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:52px;border:1px solid var(--line);border-radius:999px;background:var(--bg);padding:0 18px 0 46px;font-size:15.5px;transition:border-color .2s,box-shadow .2s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer;transition:background-color .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* call cards */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px}
.pcard{position:relative;display:flex;flex-direction:column;gap:14px;padding:22px;border-radius:26px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s;cursor:pointer;min-width:0;isolation:isolate}
.pcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.pcard::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:radial-gradient(120% 80% at 100% 0%,color-mix(in srgb,var(--u,var(--accent)) 10%,transparent),transparent 55%);opacity:0;transition:opacity .4s}
.pcard:hover::before{opacity:1}
.ph{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:0 0 auto;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:15px;letter-spacing:-.02em;color:#fff;background:var(--av,#0E7C5A)}
.ph .who{min-width:0;flex:1}
.ph .who b{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .who small{display:block;font-size:12.5px;color:var(--muted)}
.pcard h3{margin:0;font-size:20px;line-height:1.22;letter-spacing:-.02em;font-weight:700;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.facts-row{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;color:var(--ink2)}
.facts-row span{display:inline-flex;align-items:center;gap:6px;min-width:0}
.facts-row .ic{width:16px;height:16px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 7px;border-radius:999px;background:var(--surface);color:var(--ink2);font-size:12.5px;font-weight:600}
.tag .ic{width:14px;height:14px;color:var(--accent)}
.dl{margin-top:auto;display:flex;align-items:flex-end;gap:14px;padding-top:14px;border-top:1px dashed var(--line)}
.dl .num{display:flex;align-items:baseline;gap:6px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;line-height:1;color:var(--u,var(--accent))}
.dl .num strong{font-size:40px;letter-spacing:-.04em}
.dl .num em{font-style:normal;font-size:15px;font-weight:700}
.dl .when{flex:1;min-width:0}
.dl .when small{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.bar{height:6px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--u,var(--accent));transform-origin:left;animation:grow 1s var(--ease) both;animation-delay:calc(var(--d,0) * 60ms + 200ms)}
@keyframes grow{from{transform:scaleX(0)}}
.dl .nodate{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:18px;color:var(--ink2)}
.go-btn{flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;transition:background-color .25s,color .25s,border-color .25s,transform .3s var(--ease)}
.pcard:hover .go-btn{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:rotate(-45deg)}
.u-red{--u:var(--red)} .u-amber{--u:#D97706} .u-green{--u:var(--accent)} .u-none{--u:var(--muted)}
.pcard.hero{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.pcard.hero .ph .who b,.pcard.hero .facts-row{color:var(--forest-ink)}
.pcard.hero .ph .who small,.pcard.hero .facts-row .ic,.pcard.hero .dl .when small{color:var(--forest-muted)}
.pcard.hero .tag{background:rgba(255,255,255,.1);color:var(--forest-ink)}
.pcard.hero .tag .ic{color:var(--feature-num)}
.pcard.hero .dl{border-top-color:rgba(255,255,255,.18)}
.pcard.hero .bar{background:rgba(255,255,255,.14)}
.pcard.hero.u-green{--u:var(--feature-num)}
.pcard.hero.u-red{--u:#FF8A73}
.pcard.hero.u-amber{--u:#FCD34D}
.pcard.hero .st{color:var(--forest-ink)}
.pcard.hero .go-btn{background:transparent;color:var(--forest-ink);border-color:rgba(255,255,255,.35)}
.pcard.hero:hover .go-btn{background:var(--feature-num);color:#04140D;border-color:var(--feature-num)}

/* compact rows (rokovi, očekuje se) */
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--bg);border:1px solid var(--line);transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.item:hover{box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
.item .main{flex:1 1 300px;min-width:0}
.item h3{margin:2px 0;font-size:17px;line-height:1.3;font-weight:700}
.item .side{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.days{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;white-space:nowrap;color:var(--u,var(--ink))}
.donor{font-size:13px;color:var(--muted)}
.meta{font-size:15px;color:var(--ink2);margin:0}
.big{font-family:"Bricolage Grotesque",sans-serif;font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1;margin:0;color:var(--accent)}
.small{font-size:13px;color:var(--muted);margin:4px 0 0}
.empty{border:1.5px dashed var(--line);border-radius:24px;padding:40px 24px;text-align:center;color:var(--muted)}
.empty .ic{width:36px;height:36px;color:var(--accent);margin-bottom:10px}
.note{background:var(--surface);border-radius:16px;padding:14px 16px;color:var(--ink2);font-size:14px}
.err{color:var(--danger);font-weight:600}

/* generic cards kept for izvori/cijene */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.card{background:var(--surface);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:12px;min-height:0}
.card h3{margin:0;font-size:21px;line-height:1.25;font-weight:700}

/* donor cards */
.dcard{position:relative;display:flex;flex-direction:column;gap:12px;padding:22px;border-radius:26px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s;min-width:0}
.dcard:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);border-color:color-mix(in srgb,var(--av,var(--accent)) 40%,var(--line))}
.dcard h3{margin:0;font-size:19px;line-height:1.25;letter-spacing:-.02em}
.dcard .desc{margin:0;font-size:14.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.dcard.open .desc{-webkit-line-clamp:unset;display:block}
.dcard .kome{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink2);margin:0}
.dcard .kome .ic{color:var(--accent);margin-top:2px}
.dcard .more{align-self:flex-start;border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:14px;cursor:pointer}
.acts{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;padding-top:14px;border-top:1px dashed var(--line)}
.act{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:700;transition:background-color .2s,color .2s,transform .2s var(--ease);max-width:100%}
.act span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act:hover{background:var(--ink);color:var(--bg);transform:translateY(-1px)}
.act.main-act{background:var(--accent);color:var(--accent-ink)}
.act.main-act:hover{background:var(--accent-2);color:var(--accent-ink)}
.trust{font-size:12.5px;color:var(--muted);margin:0}

/* drawer */
.drawer-back{position:fixed;inset:0;background:rgba(7,20,14,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20;display:flex;justify-content:flex-end;animation:fade .25s ease-out both}
.drawer{width:min(520px,100%);height:100%;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 26px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;flex-direction:column;gap:16px;animation:slidein .45s var(--ease) both;box-shadow:-30px 0 60px -30px rgba(0,0,0,.4)}
.drawer>*{flex-shrink:0;animation:rise .5s var(--ease) both}
.drawer>*:nth-child(2){animation-delay:.04s}.drawer>*:nth-child(3){animation-delay:.08s}.drawer>*:nth-child(4){animation-delay:.12s}.drawer>*:nth-child(5){animation-delay:.16s}.drawer>*:nth-child(n+6){animation-delay:.2s}
.drawer .feature-box{background:var(--forest);color:var(--forest-ink);border-radius:24px;padding:22px;position:relative;overflow:hidden}
.drawer .feature-box .big{color:var(--feature-num)}
.drawer .feature-box .small{color:var(--forest-muted)}
.drawer .feature-box .bar{background:rgba(255,255,255,.14);margin-top:14px}
.drawer .feature-box .st{color:var(--forest-ink)}
dl.facts{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;background:var(--surface);border-radius:20px;padding:18px}
dl.facts dt{font-size:12px;color:var(--muted)}
dl.facts dd{margin:2px 0 0;font-weight:600;font-size:15px;overflow-wrap:anywhere}
dl.facts .wide{grid-column:1/-1}
.x-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),background-color .2s}
.x-btn:hover{transform:rotate(90deg);background:var(--surface)}
@keyframes slidein{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* forms */
form.panel{display:flex;flex-direction:column;gap:18px;max-width:720px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field legend{font-size:14px;font-weight:700}
.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--bg);font-size:16px;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.field textarea{min-height:90px;resize:vertical}
fieldset{border:none;padding:0;margin:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.admin-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.admin-row .main{flex:1 1 280px;min-width:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:999px;font-weight:600;z-index:30;box-shadow:var(--shadow-hi);animation:toastin .45s var(--ease) both;max-width:calc(100% - 32px)}
.toast .ic{color:var(--feature-num)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}

/* pricing */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:stretch}
.price{position:relative;border:1px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;gap:12px;background:var(--bg);box-shadow:var(--shadow);transition:transform .35s var(--ease),box-shadow .35s}
.price:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi)}
.price.hl{background:var(--forest);border-color:var(--forest);color:var(--forest-ink)}
.price.hl .donor,.price.hl .trust,.price.hl li{color:var(--forest-muted)}
.price.hl .amt small{color:var(--forest-muted)}
.price .flag{position:absolute;top:-12px;right:22px;padding:5px 12px;border-radius:999px;background:var(--amber);color:#3A2200;font-size:12.5px;font-weight:800}
.price .pname{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:700;margin:0;letter-spacing:-.02em}
.price .amt{font-family:"Bricolage Grotesque",sans-serif;font-size:52px;font-weight:800;letter-spacing:-.05em;margin:4px 0 0;line-height:1}
.price .amt small{font-family:"Plus Jakarta Sans",sans-serif;font-size:15px;font-weight:600;letter-spacing:0;color:var(--muted)}
.price ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;color:var(--ink2);font-size:15px}
.price li{display:flex;gap:10px;align-items:flex-start}
.price li .ic{color:var(--accent);margin-top:3px}
.price.hl li .ic{color:var(--feature-num)}
.price li.no{color:var(--muted)}
.price li.no .ic{color:var(--muted)}
.price .btn{margin-top:auto}
.price.hl .btn.primary{background:var(--feature-num);border-color:var(--feature-num);color:#04140D}
.service{background:var(--surface);border-radius:30px;padding:32px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:28px}
.service h2{font-size:30px}
.contact{display:flex;flex-direction:column;gap:4px;font-size:14px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.checks label{display:flex;gap:10px;align-items:center;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;font-weight:500;font-size:15px;background:var(--bg)}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
footer{max-width:1220px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:13px}

/* auth */
.auth-shell{display:grid;grid-template-columns:1fr;min-height:calc(100vh - 140px);border-radius:32px;overflow:hidden;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow-hi);max-width:1120px;margin:0 auto}
@media (min-width:900px){.auth-shell{grid-template-columns:1.02fr 1fr}}
.auth-art{position:relative;overflow:hidden;background:var(--forest);color:var(--forest-ink);padding:36px;display:flex;flex-direction:column;gap:22px;isolation:isolate}
.auth-art::before{content:"";position:absolute;z-index:-1;width:520px;height:520px;right:-180px;top:-200px;border-radius:50%;background:radial-gradient(circle,rgba(126,226,184,.38),transparent 65%);animation:drift 14s ease-in-out infinite alternate}
.auth-art::after{content:"";position:absolute;z-index:-1;width:420px;height:420px;left:-160px;bottom:-180px;border-radius:50%;background:radial-gradient(circle,rgba(245,158,11,.22),transparent 65%);animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-60px,50px) scale(1.12)}}
.auth-art h2{color:var(--forest-ink);font-size:clamp(28px,3.4vw,40px);line-height:1.05;letter-spacing:-.04em;font-weight:800;max-width:16ch}
.auth-art p{color:var(--forest-muted);margin:0;max-width:44ch}
.stream{position:relative;flex:1 1 0;min-height:280px;overflow:hidden;mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent);-webkit-mask-image:linear-gradient(180deg,transparent,#000 14%,#000 86%,transparent)}
.stream-in{display:flex;flex-direction:column;gap:12px;animation:scrollup var(--dur,40s) linear infinite}
.stream:hover .stream-in{animation-play-state:paused}
@keyframes scrollup{to{transform:translateY(-50%)}}
.mini{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px)}
.mini .av{width:36px;height:36px;border-radius:11px;font-size:13px}
.mini .t{flex:1;min-width:0}
.mini .t b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .t small{display:block;font-size:12px;color:var(--forest-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .d{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:18px;color:var(--feature-num);white-space:nowrap}
.mini .d.red{color:#FF9B85}.mini .d.amber{color:#FCD34D}
.astats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.astats div{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.06)}
.astats strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.astats span{font-size:12.5px;color:var(--forest-muted)}
.auth-panel{padding:40px clamp(22px,5vw,56px);display:flex;flex-direction:column;justify-content:center;gap:20px;min-width:0}
.auth-panel h1{font-size:clamp(32px,4vw,44px)}
.auth-panel .lead{font-size:16px;margin-top:6px}
.auth-switch{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px;background:var(--surface);max-width:360px}
.auth-switch a{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:999px;font-weight:700;font-size:14.5px;color:var(--ink2);text-decoration:none;transition:color .3s}
.auth-switch a[aria-current="page"]{color:var(--ink)}
.auth-switch::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--bg);box-shadow:var(--shadow);transition:transform .45s var(--ease)}
.auth-switch.reg::before{transform:translateX(100%)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-form>*{animation:rise .5s var(--ease) both}
.auth-form>*:nth-child(2){animation-delay:.05s}.auth-form>*:nth-child(3){animation-delay:.1s}.auth-form>*:nth-child(4){animation-delay:.15s}.auth-form>*:nth-child(5){animation-delay:.2s}.auth-form>*:nth-child(n+6){animation-delay:.25s}
.fl{position:relative}
.fl .ic.lead-ic{position:absolute;left:16px;top:18px;color:var(--muted);pointer-events:none;transition:color .2s}
.fl input{width:100%;height:58px;border:1.5px solid var(--line);border-radius:16px;background:var(--surface);padding:22px 16px 6px 46px;font-size:16px;transition:border-color .2s,background-color .2s,box-shadow .2s}
.fl label{position:absolute;left:46px;top:18px;font-size:15.5px;color:var(--muted);pointer-events:none;transform-origin:left top;transition:transform .2s var(--ease),color .2s}
.fl input:focus,.fl input:not(:placeholder-shown){background:var(--bg)}
.fl input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 16%,transparent)}
.fl input:focus+label,.fl input:not(:placeholder-shown)+label{transform:translateY(-11px) scale(.78);color:var(--accent);font-weight:700}
.fl input:focus~.ic.lead-ic{color:var(--accent)}
.fl.pw input{padding-right:56px}
.eye{position:absolute;right:8px;top:8px;width:42px;height:42px;border:0;border-radius:12px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background-color .2s,color .2s}
.eye:hover{background:var(--surface2);color:var(--ink)}
.meter{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.meter i{height:5px;border-radius:999px;background:var(--line);transition:background-color .3s}
.meter-t{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.btn.wide{width:100%;min-height:54px;font-size:16px}
.auth-panel .err:empty,#auth-extra:empty{display:none}
.ok-box{display:flex;gap:12px;align-items:flex-start;background:var(--mint);color:var(--mint-ink);border-radius:18px;padding:16px 18px;font-weight:600;margin:0}
.ok-box .ic{flex:0 0 auto;margin-top:2px}
.mailart{width:76px;height:76px;border-radius:24px;display:grid;place-items:center;background:var(--mint);color:var(--accent);animation:pop .6s var(--ease) both}
.mailart .ic{width:36px;height:36px}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.auth-links{display:flex;justify-content:flex-end;font-size:14px;font-weight:700;margin-top:-4px}
.auth-links a{text-decoration:none}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink2)}
.check input{flex:0 0 20px;width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.acc-card{background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.acc-card h2{font-size:20px}
.acc-card .fl input{height:54px}
.lock{max-width:620px;margin:24px auto;text-align:center;padding:48px 28px;border-radius:32px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow-hi)}
.lock-ic{width:72px;height:72px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:var(--mint);color:var(--accent);animation:pop .6s var(--ease) both}
.lock h1{font-size:clamp(28px,4vw,40px)}
.plan-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--mint);color:var(--mint-ink);font-weight:700;font-size:13px}
.plan-badge.free{background:var(--surface);color:var(--ink2)}
.quota{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:16px;background:var(--warm);color:var(--warm-ink);font-size:14px;font-weight:600}

/* hero on Za tebe */
.intro{position:relative;padding:8px 0 4px}
.intro h1{max-width:16ch}
.intro .lead{font-size:19px}
.kpis{display:flex;flex-wrap:wrap;gap:28px;margin-top:26px}
.kpis div{min-width:110px}
.kpis strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}
.kpis span{font-size:13.5px;color:var(--muted)}

/* skeleton */
.sk{border-radius:26px;background:linear-gradient(100deg,var(--surface) 30%,var(--surface2) 50%,var(--surface) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite;min-height:260px}
@keyframes shimmer{to{background-position:-150% 0}}

/* view enter + staggered items */
.v-enter{animation:viewin .55s var(--ease) both}
@keyframes viewin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.stag>*{animation:rise .6s var(--ease) both;animation-delay:calc(min(var(--d,0),12) * 55ms)}
.word-in{display:inline-block;animation:rise .7s var(--ease) both}

@media (max-width:640px){
  main{padding:28px 16px 64px}
  .top-in{padding:10px 16px}
  .pcard,.dcard{padding:18px;border-radius:22px}
  .dl .num strong{font-size:34px}
  .auth-shell{border-radius:24px;min-height:0}
  .auth-art{padding:24px}
  .stream{min-height:0;max-height:150px}
  .astats strong{font-size:22px}
  .price .amt{font-size:44px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .stream-in{animation:none!important}
}
.doc{max-width:760px;margin:0 auto}
.doc h1{font-size:clamp(34px,5vw,52px)}
.doc-meta{font-size:13px;color:var(--muted);margin:0 0 10px}
.doc-toc{margin:28px 0 8px;padding:20px 22px;border-radius:22px;background:var(--surface)}
.doc-toc p{margin:0 0 8px;font-weight:700}
.doc-toc ol{margin:0;padding-left:20px;columns:2 240px;column-gap:28px;line-height:1.9}
.doc-toc a{color:var(--ink2);text-decoration:none;font-weight:600}
.doc-toc a:hover{color:var(--accent)}
.doc-sec{padding-top:28px;scroll-margin-top:90px}
.doc-sec h2{font-size:22px;margin-bottom:10px}
.doc-sec p,.doc-sec li{color:var(--ink2);font-size:16px;line-height:1.7;max-width:68ch}
.doc-sec ul{padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc-sec strong{color:var(--ink)}
.foot-in{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px}
.foot-in nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot-in a{color:var(--ink2);text-decoration:none;font-weight:600}
.foot-in a:hover{color:var(--accent)}
.danger-zone{border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
</style>

function authPoruka(e){
  var m=String(e&&e.message||"").toLowerCase(),st=e&&e.status;
  if(m.indexOf("invalid login")!==-1)return "Pogrešan email ili lozinka.";
  if(m.indexOf("email not confirmed")!==-1)return "Email još nije potvrđen. Otvori link koji smo ti poslali ili zatraži novi ispod.";
  if(m.indexOf("already")!==-1&&m.indexOf("regist")!==-1)return "Ovaj email je već registrovan. Prijavi se ili obnovi lozinku.";
  if(m.indexOf("same")!==-1&&m.indexOf("password")!==-1)return "Nova lozinka mora biti drugačija od stare.";
  if(m.indexOf("password")!==-1&&(m.indexOf("should")!==-1||m.indexOf("weak")!==-1||m.indexOf("least")!==-1))return "Lozinka je preslaba. Koristi bar 8 znakova, slova i brojeve.";
  if(st===429||m.indexOf("rate limit")!==-1||m.indexOf("security purposes")!==-1)return "Previše pokušaja zaredom. Sačekaj minutu pa pokušaj ponovo.";
  if(m.indexOf("signups not allowed")!==-1||m.indexOf("signup is disabled")!==-1)return "Registracija je trenutno zatvorena.";
  if(m.indexOf("sending")!==-1&&m.indexOf("email")!==-1)return "Email trenutno ne može biti poslan. Pokušaj malo kasnije.";
  if(m.indexOf("fetch")!==-1||m.indexOf("network")!==-1)return "Nema veze sa serverom. Provjeri internet pa pokušaj ponovo.";
  if(m.indexOf("expired")!==-1||m.indexOf("invalid")!==-1)return "Link je istekao ili je već iskorišten. Zatraži novi.";
  return "Nije uspjelo. Pokušaj ponovo.";
}

function authSubmit(a,f){
  if(a==="login-form"){
    var em=f.email.value.trim(),pw=f.lozinka.value;S.zadnjiEmail=em;
    if(!emailOk(em)){authErr("Upiši ispravan email.");f.email.focus();return true;}
    if(!pw){authErr("Upiši lozinku.");f.lozinka.focus();return true;}
    setBusy(f,true,"Prijavljivanje…");
    S.sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
      if(r.error){setBusy(f,false);authErr(authPoruka(r.error));
        if(String(r.error.message||"").toLowerCase().indexOf("not confirmed")!==-1){S.regSent=em;var ex=document.getElementById("auth-extra");if(ex)ex.innerHTML='<button class="btn ghost" type="button" data-act="resend">Pošalji link za potvrdu ponovo</button>';}
        return;}
      S.loginMsg="";location.hash=ss("pozivnik_posle")||"#za-tebe";ss("pozivnik_posle",null);location.reload();
    });
    return true;
  }
  if(a==="reg-form"){
    var ime=f.ime.value.trim(),org=f.org.value.trim(),em3=f.email.value.trim(),p1=f.lozinka.value,p2=f.lozinka2.value;

    if(!lozinkaOk(p1)){authErr("Lozinka treba imati bar 8 znakova, slova i bar jedan broj.");f.lozinka.focus();return true;}
    if(p1!==p2){authErr("Lozinke se ne poklapaju.");f.lozinka2.focus();return true;}
    if(!f.uslovi.checked){authErr("Potvrdi da se slažeš s uslovima korištenja.");return true;}
    setBusy(f,true,"Pravim nalog…");
    S.sb.auth.signUp({email:em3,password:p1,options:{emailRedirectTo:redirectUrl(),data:{ime:ime,organizacija:org}}}).then(function(r){
      setBusy(f,false);
      if(r.error){authErr(authPoruka(r.error));return;}
      var u=r.data&&r.data.user;
      if(u&&Array.isArray(u.identities)&&u.identities.length===0){authErr("Ovaj email je već registrovan. Prijavi se ili obnovi lozinku.");return;}
      if(r.data&&r.data.session){location.hash=ss("pozivnik_posle")||"#profil";ss("pozivnik_posle",null);location.reload();return;}
      S.regSent=em3;S.zadnjiEmail=em3;render();
    });
    return true;
  }
  if(a==="forgot-form"){
    var em4=f.email.value.trim();
    if(!emailOk(em4)){authErr("Upiši ispravan email.");f.email.focus();return true;}
    setBusy(f,true,"Šaljem…");
    S.sb.auth.resetPasswordForEmail(em4,{redirectTo:redirectUrl()}).then(function(r){
      setBusy(f,false);
      if(r.error&&(r.error.status===429||/rate|security purposes|fetch|network/i.test(r.error.message||""))){authErr(authPoruka(r.error));return;}
      S.resetSent=em4;S.zadnjiEmail=em4;render();
    });
    return true;
  }
  if(a==="newpw-form"||a==="chpw-form"){
    var errId=a==="chpw-form"?"pw-err":"auth-err",q1=f.lozinka.value,q2=f.lozinka2.value;
    if(!lozinkaOk(q1)){authErr("Lozinka treba imati bar 8 znakova, slova i bar jedan broj.",errId);f.lozinka.focus();return true;}
    if(q1!==q2){authErr("Lozinke se ne poklapaju.",errId);f.lozinka2.focus();return true;}
    setBusy(f,true,"Čuvam…");
    S.sb.auth.updateUser({password:q1}).then(function(r){
      setBusy(f,false);
      if(r.error){authErr(authPoruka(r.error),errId);return;}
      f.reset();authErr("",errId);toast("Lozinka je sačuvana.");
      if(a==="newpw-form"){S.recovery=false;S.invite=false;location.hash="#za-tebe";}
    });
    return true;
  }
  if(a==="chmail-form"){
    var nm=f.email.value.trim();
    if(!emailOk(nm)){authErr("Upiši ispravan email.","mail-err");return true;}
    if(nm.toLowerCase()===String(S.email||"").toLowerCase()){authErr("To je već tvoj email.","mail-err");return true;}
    setBusy(f,true,"Šaljem…");
    S.sb.auth.updateUser({email:nm},{emailRedirectTo:redirectUrl()}).then(function(r){
      setBusy(f,false);
      if(r.error){authErr(authPoruka(r.error),"mail-err");return;}
      f.reset();authErr("","mail-err");toast("Poslali smo link za potvrdu na "+nm+".");
    });
    return true;
  }
  if(a==="obrisi-form"){
    if(f.potvrda.value.trim().toUpperCase()!=="OBRIŠI"&&f.potvrda.value.trim().toUpperCase()!=="OBRISI"){authErr("Upiši OBRIŠI da potvrdiš brisanje.","del-err");return true;}

      if(r.error){setBusy(f,false);authErr("Brisanje nije uspjelo. Piši nam na hgluhacevic22@gmail.com i obrisaćemo nalog ručno.","del-err");return;}
      S.sb.auth.signOut().finally(function(){location.hash="#za-tebe";location.reload();});
    });
    return true;
  }
  if(a==="meta-form"){
    setBusy(f,true,"Čuvam…");
    S.sb.auth.updateUser({data:{ime:f.ime.value.trim(),organizacija:f.org.value.trim()}}).then(function(r){
      setBusy(f,false);if(r.error){toast(authPoruka(r.error));return;}
      S.meta=(r.data&&r.data.user&&r.data.user.user_metadata)||S.meta;toast("Podaci sačuvani.");
    });
    return true;
  }
  return false;
}

function hitnost(r){if(!r.has||r.past)return "u-none";if(r.n<=7)return "u-red";if(r.n<=21)return "u-amber";return "u-green";}
function barPct(r){if(!r.has||r.past)return 0;return Math.max(5,Math.min(100,Math.round(r.n/60*100)));}
function statusPill(s){return '<span class="pill st-'+esc(s)+'">'+esc(STATUS[s]||s)+'</span>';}
function statusDot(s){return '<span class="st st-'+esc(s)+'"><i></i>'+esc(STATUS[s]||s)+'</span>';}
function rokBlok(p,r){
  if(r.has&&!r.past)return '<div class="num"><strong>'+(r.est?"≈":"")+r.n+'</strong><em>'+danRijec(r.n)+'</em></div><div class="when"><small>'+esc(r.est?"procjena: "+fmtDate(p.rokProcjena):"rok "+fmtDate(p.rok))+'</small><div class="bar"><i style="width:'+barPct(r)+'%"></i></div></div>';
  return '<div class="when"><small>'+(r.has&&r.past?esc(r.sub):"Rok")+'</small><span class="nodate">'+esc(r.has&&r.past?"Rok je prošao":r.label)+'</span></div>';
}

function osnovniFilter(p){
  if(p._odobren===false)return false;

  return true;
}
function tagOk(p,t){if(t==="svi")return true;if(t==="moji")return matches(p);return (p.teme||[]).indexOf(t)!==-1;}

var THUMB={};
function pomjeriThumb(box,el,key){
  var th=box&&box.querySelector(".thumb");if(!th)return;
  if(!el){th.style.opacity="0";return;}
  var x=el.offsetLeft, w=el.offsetWidth, prev=THUMB[key];
  th.style.opacity="1";
  if(prev){th.style.transition="none";th.style.width=prev.w+"px";th.style.transform="translateX("+prev.x+"px)";void th.offsetWidth;th.style.transition="";}
  th.style.width=w+"px";th.style.transform="translateX("+x+"px)";
  THUMB[key]={x:x,w:w};
  if(key==="tabs"&&el.scrollIntoView&&(el.offsetLeft<box.scrollLeft||el.offsetLeft+w>box.scrollLeft+box.clientWidth))box.scrollTo({left:el.offsetLeft-24,behavior:"smooth"});
}
function segThumbs(){
  [].forEach.call(document.querySelectorAll("#app .seg"),function(s){

var raf=window.requestAnimationFrame?window.requestAnimationFrame.bind(window):function(f){return setTimeout(function(){f(Date.now());},16);};
var reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function brojanje(){
  if(reduceMotion)return;
  [].forEach.call(document.querySelectorAll("#app [data-count]"),function(el){
    var to=+el.getAttribute("data-count");if(!(to>0))return;var t0=null,dur=Math.min(1200,500+to*8);
    function f(ts){if(!t0)t0=ts;var k=Math.min(1,(ts-t0)/dur),e=1-Math.pow(1-k,3);el.textContent=Math.round(to*e);if(k<1)raf(f);}
    el.textContent="0";raf(f);
  });
}

  ["Zašto ih koristimo i na kojem osnovu",'<ul><li><strong>Da bi nalog i servis radili</strong> (prijava, profil, praćenje rokova, prikaz poziva): izvršenje ugovora, odnosno uslova korištenja koje prihvataš pri registraciji.</li><li><strong>Da odgovorimo na upit i izvršimo narudžbu</strong> (paket, pisanje prijave): izvršenje ugovora i radnje na tvoj zahtjev prije zaključenja ugovora.</li><li><strong>Fakture i evidencija plaćanja:</strong> zakonska obaveza.</li><li><strong>Sigurnost i sprječavanje zloupotrebe:</strong> legitimni interes.</li><li><strong>Obavještenja o rokovima i novim pozivima na email:</strong> samo ako ih uključiš, i možeš ih isključiti u svakom trenutku.</li></ul><p>Ne prodajemo podatke, ne dijelimo ih radi reklama i ne koristimo ih za automatsko odlučivanje koje bi imalo pravne posljedice za tebe.</p>'],
  ["Gdje se podaci čuvaju i ko ih još obrađuje",'<p>Koristimo pouzdane pružaoce usluga koji podatke obrađuju samo po našem nalogu:</p><ul><li><strong>Supabase</strong> (baza podataka i prijava). Podaci se čuvaju na serverima u Evropskoj uniji, u Frankfurtu (Njemačka).</li><li><strong>Brevo</strong> (slanje emailova za potvrdu naloga, lozinku i obavještenja), Francuska, Evropska unija.</li><li><strong>GitHub</strong> (smještaj web stranice i program koji prikuplja javne pozive), SAD. Na GitHubu se ne čuvaju podaci korisnika, ali server stranice bilježi IP adresu posjetioca.</li><li><strong>Google Fonts i jsDelivr</strong> (fontovi i programske biblioteke stranice). Pri učitavanju stranice tvoj preglednik im šalje IP adresu.</li></ul><p>Kad podaci idu izvan BiH, to je u EU, koja ima odgovarajući nivo zaštite, ili uz standardne ugovorne klauzule koje ti pružaoci nude.</p>'],
  ["Koliko dugo ih čuvamo",'<ul><li>Podatke naloga i profila dok imaš nalog. Kad obrišeš nalog, brišu se odmah, a iz rezervnih kopija pružaoca najkasnije u roku od 30 dana.</li><li>Upite i narudžbe do dvije godine od završetka posla, osim dijela koji moramo čuvati duže zbog računovodstvenih i poreskih propisa (fakture).</li><li>Tehničke zapise onoliko koliko ih čuvaju pružaoci, obično nekoliko dana do nekoliko sedmica.</li></ul>'],
  ["Tvoja prava",'<p>U svakom trenutku možeš:</p><ul><li>zatražiti uvid u podatke koje imamo o tebi i njihovu kopiju;</li><li>ispraviti netačne podatke (većinu i sam, u <a href="#nalog">Mom nalogu</a> i <a href="#profil">Profilu</a>);</li><li>obrisati nalog i sve podatke dugmetom „Obriši nalog“ u Mom nalogu, ili zahtjevom na email;</li><li>ograničiti obradu ili joj prigovoriti;</li><li>dobiti podatke u mašinski čitljivom obliku (prenosivost);</li><li>povući pristanak za obavještenja, bez uticaja na raniju obradu.</li></ul><p>Na zahtjeve odgovaramo najkasnije u roku od 30 dana. Ako smatraš da podatke obrađujemo protivno zakonu, možeš podnijeti prigovor Agenciji za zaštitu ličnih podataka u Bosni i Hercegovini (<a href="https://www.azlp.ba" target="_blank" rel="noopener noreferrer">azlp.ba</a>).</p>'],

  ["Šta je Pozivnik",'<p>Pozivnik je servis koji na jednom mjestu prikuplja javne pozive, grantove i davaoce sredstava u Bosni i Hercegovini, te nudi uslugu pisanja prijava na pozive. Servis vodi '+VLASNIK+', Bosna i Hercegovina („mi“).</p>'],

  ["Tačnost podataka o pozivima",'<p>Pozive prikupljamo iz javnih izvora: web stranica institucija, službenih glasila i medija. Trudimo se da podaci budu tačni i ažurni, ali <strong>mjerodavan je uvijek originalni poziv</strong> davaoca. Prije prijave provjeri uslove, rok i dokumentaciju u originalu, do kojeg vodi link kod svakog poziva.</p><p>Rok s oznakom „≈“ i pozivi „Očekuje se“ su procjene na osnovu ranijih godina, a ne službeni podatak. Ne odgovaramo za štetu nastalu zbog oslanjanja na podatke bez provjere u originalnom pozivu, niti za izmjene koje davalac napravi nakon objave.</p>'],
  ["Pisanje prijava",'<ul><li>Usluga pisanja prijave se ugovara posebno: nakon upita šaljemo ponudu s cijenom, rokom i spiskom dokumentacije. Posao počinje kad prihvatiš ponudu.</li><li>Ti odgovaraš za tačnost dokumentacije i podataka o organizaciji. Prije predaje pregledaš i potpisuješ prijavu, a predaješ je ti, osim ako se drugačije ne dogovorimo.</li><li><strong>Ne garantujemo da će prijava biti odobrena.</strong> Odluku donosi isključivo davalac sredstava.</li><li>Ako davalac ne dozvoljava da se izrada prijave plati iz budžeta projekta, usluga se plaća iz vlastitih sredstava.</li><li>Tekstove napisane za tebe možeš slobodno koristiti za svoje projekte nakon plaćanja usluge.</li></ul>'],
  ["Dozvoljeno korištenje",'<p>Nije dozvoljeno:</p><ul><li>automatsko preuzimanje (scraping) baze poziva, davalaca i izvora, ni njihova preprodaja ili objavljivanje na drugom servisu;</li><li>zaobilaženje ograničenja paketa ili zaštite servisa;</li><li>korištenje servisa za slanje neželjenih poruka ili za bilo šta protivno zakonu.</li></ul><p>Kod kršenja ovih pravila možemo ograničiti ili ukinuti nalog. Ako je nalog bio plaćen, vraćamo srazmjeran dio iznosa, osim kod namjerne zloupotrebe.</p>'],
  ["Prava na sadržaj",'<p>Tekstovi poziva pripadaju davaocima. Izbor, opis, razvrstavanje i baza poziva i izvora, izgled i program Pozivnika su naši. Smiješ ih koristiti za vlastiti rad, ali ne i kopirati u većem obimu.</p>'],

  else if(a==="new-don"){S.editDon={vrsta:"humanitarna"};render();}
  else if(a==="edit-don"){var d=S.donatori.filter(function(x){return x.id===id;})[0];if(d){S.editDon=JSON.parse(JSON.stringify(d));render();window.scrollTo(0,0);}}
  else if(a==="cancel-don"){S.editDon=null;render();}
  else if(a==="delete-don"&&S.editDon&&S.editDon.id){if(!confirm("Obrisati ovu organizaciju?"))return;var ddid=S.editDon.id;queue(function(){return S.db.collection("donatori").doc(ddid).delete();}).then(function(){toast("Organizacija obrisana");});S.editDon=null;render();}
  else if(a==="delete"&&S.edit&&S.edit.id){if(!confirm("Obrisati ovaj poziv iz baze?"))return;var did=S.edit.id;queue(function(){return S.db.collection("pozivi").doc(did).delete();}).then(function(){toast("Poziv obrisan");});S.edit=null;render();}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&(S.open||S.paywall)){S.open=null;S.paywall=null;renderDrawer();if(S.lastFocus&&document.contains(S.lastFocus))S.lastFocus.focus();}});
document.addEventListener("change",function(ev){
  var el=ev.target;if(el&&el.id==="opk"){S.opKanton=el.value;render();return;}
  if(!el||el.getAttribute("data-act")!=="upit-status")return;
  var uid=el.getAttribute("data-u"), i=+el.getAttribute("data-i"), doc=S.sviUpiti.filter(function(u){return u.id===uid;})[0];
  if(!doc)return;var arr=JSON.parse(JSON.stringify(doc.zahtjevi||[]));if(!arr[i])return;arr[i].status=el.value;
  queue(function(){return S.db.collection("upiti").doc(uid).update({zahtjevi:arr});}).then(function(){toast("Status promijenjen");});
});
document.addEventListener("input",function(ev){if(ev.target&&ev.target.id==="q"){S.q=ev.target.value;S.focusQ=true;render();}if(ev.target&&ev.target.id==="opq"){S.opQ=ev.target.value;S.focusOp=true;render();}if(ev.target&&ev.target.id==="dq"){S.dq=ev.target.value;S.focusD=true;render();}});
document.addEventListener("submit",function(ev){
  var f=ev.target, a=f.getAttribute("data-act");ev.preventDefault();
  if(a==="search-form")return;
  if(a==="profil-form"){S.profil.tip=f.tip.value;S.profil.podrucje=f.podrucje.value;var pr=saveProfil();toast("Profil sačuvan");if(pr)pr.then(function(){});location.hash="#za-tebe";}
  if(authSubmit(a,f))return;
  if(a==="op-form"){
    var oid=f.getAttribute("data-id"), ow=(f.web.value||"").trim(), orb=(f.rubrika.value||"").trim();
    if((ow&&!safeUrl(ow))||(orb&&!safeUrl(orb))){toast("Link nije ispravan.");return;}
    var ob={web:ow?safeUrl(ow):"",rubrika:orb?safeUrl(orb):"",napomena:(f.napomena.value||"").trim(),status:orb?"rubrika":(ow?"web":"nije"),provjereno:new Date().toISOString().slice(0,10)};
    queue(function(){return S.db.collection("opcine").doc(oid).update(ob);}).then(function(){toast("Općina ažurirana");});
    S.editOp=null;render();return;
  }
  if(a==="don-form"&&S.editDon){
    var dn=S.editDon, fields=["naziv","vrsta","opis","kome","web","facebook","pozivi","email","telefon","adresa","osobe","napomena","provjereno"];
    fields.forEach(function(k){dn[k]=(f[k].value||"").trim();});
    var de=document.getElementById("don-err");
    if(!dn.naziv){de.textContent="Upiši naziv organizacije.";return;}
    if(dn.web&&!safeUrl(dn.web)){de.textContent="Web adresa nije ispravna.";return;}
    if(dn.facebook&&!safeUrl(dn.facebook)){de.textContent="Facebook link nije ispravan.";return;}
    if(dn.pozivi&&!safeUrl(dn.pozivi)){de.textContent="Link na javne pozive nije ispravan.";return;}
    var dbody={};fields.forEach(function(k){dbody[k]=dn[k]||"";});dbody.web=dn.web?safeUrl(dn.web):"";dbody.facebook=dn.facebook?safeUrl(dn.facebook):"";dbody.pozivi=dn.pozivi?safeUrl(dn.pozivi):"";
    var dref=dn.id?S.db.collection("donatori").doc(dn.id):S.db.collection("donatori").doc();
    queue(function(){return dref.set(dbody);}).then(function(){toast("Organizacija sačuvana");});
    S.editDon=null;render();return;
  }
  if(a==="order-form"){
    var oe=document.getElementById("order-err");
    var org=f.organizacija.value.trim(), os=f.osoba.value.trim(), em=f.email.value.trim();
    if(!org||!os||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){oe.textContent="Upiši naziv organizacije, kontakt osobu i ispravan email.";return;}
    if(!S.db||!S.uid){oe.textContent="Upit se ne može poslati jer nisi prijavljen.";return;}
    var pz=S.pozivi.filter(function(x){return x.id===f.poziv.value;})[0];
    var dok=[].slice.call(f.querySelectorAll('input[name="dok"]:checked')).map(function(x){return x.value;});
    var z={id:String(Date.now()),kreirano:new Date().toISOString(),sta:f.sta.value,pozivId:pz?pz.id:"",pozivNaslov:pz?pz.naslov:"",organizacija:org,osoba:os,email:em,telefon:f.telefon.value.trim(),opis:f.opis.value.trim().slice(0,2000),dokumenti:dok,status:"novo"};
    var arr=S.mojiUpiti.slice(-49).concat([z]);
    var btn=f.querySelector('button[type="submit"]');btn.disabled=true;
    queue(function(){return S.db.collection("upiti").doc(S.uid).set({zahtjevi:arr});}).then(function(){toast("Upit poslan. Javit ćemo ti se uskoro.");S.orderFor="";S.orderPaket="";});
    return;
  }
  if(a==="poziv-form"&&S.edit){
    var e=S.edit;["naslov","davalac","iznos","status","rok","rokProcjena","rokNapomena","podrucje","objavljeno","ko","napomena","osnova","izvor","provjereno"].forEach(function(k){e[k]=(f[k].value||"").trim();});
    var errEl=document.getElementById("form-err");
    if(!e.naslov||!e.davalac){errEl.textContent="Upiši naziv poziva i ko ga raspisuje.";return;}
    if(e.izvor&&!safeUrl(e.izvor)){errEl.textContent="Link na poziv nije ispravan.";return;}
    e.izvor=e.izvor?safeUrl(e.izvor):"";
    var body={};["naslov","davalac","iznos","status","rok","rokProcjena","rokNapomena","podrucje","objavljeno","ko","napomena","osnova","izvor","provjereno"].forEach(function(k){body[k]=e[k]||"";});body.teme=(e.teme||[]).slice();body.azurirano=new Date().toISOString();
    var col=S.db.collection("pozivi"), ref=e.id?col.doc(e.id):col.doc();
    queue(function(){return ref.set(body);}).then(function(){toast("Poziv sačuvan");});
    S.edit=null;render();
  }
});

/* ---------- data: Supabase adapter ---------- */
function chk(r){if(r&&r.error)throw r.error;return r;}
function SupaDB(sb){
  var KEY={upiti:"user_id",profili:"user_id"};
  function k(name){return KEY[name]||"id";}
  var n=0;
  function docRef(name,id){
    var key=k(name);
    function row(data){var r={data:data,azurirano:new Date().toISOString()};r[key]=id;if(name==="pozivi")r.odobren=true;return r;}
    return {
      id:id,
      set:function(body){return sb.from(name).upsert(row(body)).then(chk);},
      update:function(part){return sb.from(name).select("data").eq(key,id).maybeSingle().then(function(r){chk(r);return sb.from(name).upsert(row(Object.assign({},r.data&&r.data.data,part))).then(chk);});},
      delete:function(){return sb.from(name).delete().eq(key,id).then(chk);},
      onSnapshot:function(cb,err){
        function load(){sb.from(name).select("data").eq(key,id).maybeSingle().then(function(r){if(r.error){if(err)err(r.error);return;}cb({exists:!!r.data,data:function(){return r.data?r.data.data:undefined;}});});}
        load();
        if(name!=="profili")sb.channel("d"+(n++)+"-"+name).on("postgres_changes",{event:"*",schema:"public",table:name,filter:key+"=eq."+id},load).subscribe();
      }
    };
  }
  function collection(name){
    var key=k(name);
    return {
      doc:function(id){return docRef(name,id||(window.crypto&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2)));},
      onSnapshot:function(cb,err){
        function load(){sb.from(name).select("*").limit(5000).then(function(r){
          if(r.error){if(err)err(r.error);return;}
          cb({metadata:{fromCache:false},docs:r.data.map(function(x){return {id:x[key],data:function(){var d=Object.assign({},x.data);if(name==="pozivi")d._odobren=x.odobren;return d;}};})});
        });}
        load();
        sb.channel("c"+(n++)+"-"+name).on("postgres_changes",{event:"*",schema:"public",table:name},load).subscribe();
      }
    };
  }
  function doc(path){var p=path.split("/");return p[0]==="data"?docRef("profili",p[2]):docRef(p[0],p[1]);}
  return {collection:collection,doc:doc};
}
function start(){
  render();
  var C=window.POZIVNIK_CONFIG||{};
  if(!window.supabase||!C.supabaseUrl||C.supabaseUrl.indexOf("TVOJ-")!==-1){S.offline=true;render();return;}
  var sb=window.supabase.createClient(C.supabaseUrl,C.supabaseAnonKey);
  S.sb=sb;S.db=SupaDB(sb);
  sb.auth.onAuthStateChange(function(ev,session){
    var nu=session&&session.user?session.user.id:null;
    if(ev==="PASSWORD_RECOVERY"){S.recovery=true;if(S.started){S.uid=nu;S.email=session.user.email;location.hash="#nova-lozinka";}return;}
    if(ev==="USER_UPDATED"&&session){S.email=session.user.email;S.meta=session.user.user_metadata||{};if(view()==="nalog")render();return;}
    if(ev==="SIGNED_OUT"&&S.started&&S.uid){location.hash="#za-tebe";location.reload();return;}
    if(ev==="SIGNED_IN"&&nu&&nu!==S.uid&&S.started&&!S.recovery){location.reload();}
  });
  sb.auth.getSession().then(function(res){
    var u=res.data&&res.data.session?res.data.session.user:null;
    S.started=true;S.uid=u?u.id:null;S.email=u?u.email:"";S.meta=u?(u.user_metadata||{}):{};
    var cilj=null,P=POC_HASH;
    if(P){
      if(P.error||P.error_code){S.authErr=(P.error_code==="otp_expired"||/expired|invalid/i.test(P.error_description||""))?"Link iz emaila je istekao ili je već iskorišten. Zatraži novi.":"Prijava preko linka nije uspjela. Pokušaj ponovo.";cilj="#prijava";}
      else if(P.type==="recovery"||S.recovery){S.recovery=true;cilj="#nova-lozinka";}
      else if(P.type==="invite"){S.invite=true;cilj="#nova-lozinka";}
      else if(P.type==="signup"){cilj=ss("pozivnik_posle")||"#profil";ss("pozivnik_posle",null);setTimeout(function(){toast("Email je potvrđen. Dobro došao u Pozivnik!");},400);}
      else if(P.type==="email_change"){cilj="#nalog";setTimeout(function(){toast("Email je promijenjen.");},400);}
      else{cilj=ss("pozivnik_posle")||"#za-tebe";ss("pozivnik_posle",null);}
    }else if(S.uid&&ss("pozivnik_posle")){cilj=ss("pozivnik_posle");ss("pozivnik_posle",null);}
    if(!cilj&&S.uid&&["prijava","registracija","zaboravljena-lozinka"].indexOf(view())!==-1)cilj="#za-tebe";
    if(cilj)history.replaceState(null,"",location.pathname+cilj);
    render();
    var timer=setTimeout(function(){if(!S.ready){S.loadErr="Baza se još ne javlja. Provjeri vezu.";render();}},10000);
    S.db.collection("pozivi").onSnapshot(function(snap){
      S.pozivi=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;if(!Array.isArray(x.teme))x.teme=[];return x;});
      clearTimeout(timer);S.loadErr="";S.ready=true;
      if(S.edit&&S.edit.id&&!S.pozivi.some(function(p){return p.id===S.edit.id;}))S.edit=null;
      if(!S.edit)render();else renderTabs();
    },function(){clearTimeout(timer);S.ready=true;S.pozivi=[];render();toast("Pozivi se ne mogu učitati.");});
    S.db.collection("opcine").onSnapshot(function(snap){
      S.opcine=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x;});
      if(S.ready&&view()==="izvori"&&!S.editOp)render();
    },function(){});
    S.db.collection("donatori").onSnapshot(function(snap){
      S.donatori=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x;});
      if(S.ready&&(view()==="donatori"||view()==="za-tebe"||AUTH_VIEWS.indexOf(view())!==-1)&&!S.editDon)render();
    },function(){});
    if(!S.uid){render();return;}
    sb.from("pretplate").select("paket,vazi_do").eq("user_id",S.uid).maybeSingle().then(function(r){if(r&&r.data){S.paket=r.data;render();}});
    sb.from("admini").select("user_id").eq("user_id",S.uid).maybeSingle().then(function(r){
      S.canEdit=!!(r&&r.data);render();
      if(S.canEdit)sb.from("pretplate").select("user_id,paket,vazi_do").then(function(q){S.pretplate={};(q.data||[]).forEach(function(x){S.pretplate[x.user_id]=x;});if(view()==="zahtjevi")render();});
      if(S.canEdit)S.db.collection("upiti").onSnapshot(function(snap){S.sviUpiti=snap.docs.map(function(d){var x=Object.assign({},d.data());x.id=d.id;return x;});if(view()==="zahtjevi")render();else renderTabs();},function(){});
    });
    S.db.doc("upiti/"+S.uid).onSnapshot(function(snap){S.mojiUpiti=snap.exists&&Array.isArray((snap.data()||{}).zahtjevi)?snap.data().zahtjevi.slice():[];if(view()==="naruci")render();},function(){});
    S.db.doc("data/users/"+S.uid+"/profil").onSnapshot(function(snap){
      if(snap.exists){var d=snap.data()||{};S.profil={tip:d.tip||"",teme:Array.isArray(d.teme)?d.teme.slice():[],podrucje:d.podrucje||"",pracenje:Object.assign({},d.pracenje||{}),otvoreno:d.otvoreno&&typeof d.otvoreno==="object"?d.otvoreno:{mj:"",ids:[]}};}
      S.profilLoaded=true;
      if(view()!=="profil")render();else renderTabs();
    },function(){});
  });
}
start();
})();
</script>
